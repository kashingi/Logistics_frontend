<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h4 class="mb-0">Goods Received Notes</h4>
        <button mat-flat-button color="primary" (click)="openAdd()">
            <mat-icon>add</mat-icon> Add GRN
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table mat-table [dataSource]="grns" class="w-100">
                    <ng-container matColumnDef="grnNumber">
                        <th mat-header-cell *matHeaderCellDef>GRN No</th>
                        <td mat-cell *matCellDef="let row">{{ row.grnNumber }}</td>
                    </ng-container>
                    <ng-container matColumnDef="supplier">
                        <th mat-header-cell *matHeaderCellDef>Supplier</th>
                        <td mat-cell *matCellDef="let row">{{ row.supplier?.name || '-' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="receivedDate">
                        <th mat-header-cell *matHeaderCellDef>Received</th>
                        <td mat-cell *matCellDef="let row">{{ row.receivedDate | date:'mediumDate' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="totalAmount">
                        <th mat-header-cell *matHeaderCellDef>Total</th>
                        <td mat-cell *matCellDef="let row">{{ row.totalAmount | number:'1.2-2' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef>Status</th>
                        <td mat-cell *matCellDef="let row">
                            <span class="badge bg-info">{{ row.status }}</span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef class="text-end">Actions</th>
                        <td mat-cell *matCellDef="let row" class="text-end">
                            <button mat-icon-button color="primary" matTooltip="View" (click)="openView(row)">
                                <mat-icon>visibility</mat-icon>
                            </button>
                            <button mat-icon-button color="primary" matTooltip="Approve"
                                *ngIf="row.status === 'PENDING_APPROVAL'" (click)="approve(row)">
                                <mat-icon>check_circle</mat-icon>
                            </button>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
            </div>
            <div *ngIf="!isLoading && grns.length === 0" class="text-center py-5 text-muted">No GRNs found</div>
        </div>
    </div>
</div>
