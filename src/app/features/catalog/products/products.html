<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h4 class="mb-0">Products</h4>
    <button mat-flat-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Add Product
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table mat-table [dataSource]="products" class="w-100">

          <ng-container matColumnDef="productNo">
            <th mat-header-cell *matHeaderCellDef>Product No</th>
            <td mat-cell *matCellDef="let row">{{ row.productNo || '-' }}</td>
          </ng-container>

          <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef>Image</th>
            <td mat-cell *matCellDef="let row">
              <img
                *ngIf="row.images?.[0]?.productImage; else noProductImage"
                [src]="row.images[0].productImage"
                [alt]="row.name"
                width="50"
                height="50"
              />
              <ng-template #noProductImage>
                <mat-icon aria-label="No product image">image</mat-icon>
              </ng-template>
            </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let row">{{ row.name }}</td>
          </ng-container>

          <ng-container matColumnDef="skuCode">
            <th mat-header-cell *matHeaderCellDef>SKU</th>
            <td mat-cell *matCellDef="let row">{{ row.skuCode }}</td>
          </ng-container>

          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef>Category</th>
            <td mat-cell *matCellDef="let row">{{ row.category?.name || '-' }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let row">
              <span
                class="badge"
                [class.bg-success]="row.status === 'ACTIVE'"
                [class.bg-secondary]="row.status !== 'ACTIVE'"
              >
                {{ row.status }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-end">Actions</th>
            <td mat-cell *matCellDef="let row" class="text-end">
              <button
                mat-icon-button
                color="primary"
                matTooltip="View"
                (click)="openViewDialog(row)"
              >
                <mat-icon>visibility</mat-icon>
              </button>

              <button
                mat-icon-button
                color="accent"
                matTooltip="Edit"
                (click)="openEditDialog(row)"
              >
                <mat-icon>edit</mat-icon>
              </button>

              <button
                mat-icon-button
                matTooltip="Toggle Status"
                (click)="toggleStatus(row)"
              >
                <mat-icon>
                  {{ row.status === 'ACTIVE' ? 'toggle_on' : 'toggle_off' }}
                </mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>

      <div *ngIf="!isLoading && products.length === 0" class="text-center py-5 text-muted">
        No products found
      </div>
    </div>
  </div>
</div>
