<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h4 class="mb-0">Stock Checks</h4>
        <button mat-flat-button color="primary" (click)="openAdd()">
            <mat-icon>add</mat-icon> New Stock Check
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table mat-table [dataSource]="checks" class="w-100">
                    <ng-container matColumnDef="stockCheckNo">
                        <th mat-header-cell *matHeaderCellDef>Check No</th>
                        <td mat-cell *matCellDef="let row">{{ row.stockCheckNo }}</td>
                    </ng-container>
                    <ng-container matColumnDef="warehouse">
                        <th mat-header-cell *matHeaderCellDef>Warehouse</th>
                        <td mat-cell *matCellDef="let row">{{ row.warehouse?.name || '-' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="checkDate">
                        <th mat-header-cell *matHeaderCellDef>Date</th>
                        <td mat-cell *matCellDef="let row">{{ row.checkDate | date:'mediumDate' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef>Status</th>
                        <td mat-cell *matCellDef="let row">
                            <span class="badge bg-info">{{ row.status }}</span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef class="text-end">Actions</th>
                        <td mat-cell *matCellDef="let row" class="text-end">
                            <button mat-icon-button color="primary" matTooltip="View" (click)="openView(row)">
                                <mat-icon>visibility</mat-icon>
                            </button>
                            <button mat-icon-button color="primary" matTooltip="Approve"
                                *ngIf="row.status === 'PENDING' || row.status === 'DRAFT'" (click)="approve(row)">
                                <mat-icon>check_circle</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" matTooltip="Cancel"
                                *ngIf="row.status !== 'APPROVED' && row.status !== 'CANCELLED'" (click)="cancel(row)">
                                <mat-icon>cancel</mat-icon>
                            </button>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
            </div>
            @if (isLoading) {
            <div class="text-center py-5 text-muted">
                Loading stock checks...
            </div>
            }
            <div *ngIf="!isLoading && checks.length === 0" class="text-center py-5 text-muted">
                No stock checks found
            </div>
        </div>
    </div>
</div>
