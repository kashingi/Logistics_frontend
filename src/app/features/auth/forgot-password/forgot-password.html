<div class="auth-page">
  <div class="container-fluid p-0">
    <div class="row g-0">
      <app-auth-welcome-panel class="col-12 col-md-6 d-none d-md-flex"></app-auth-welcome-panel>
      <div class="col-12 col-md-6 auth-right-panel d-flex align-items-center justify-content-center">
        <div class="forgot-card">

          <div class="text-center mb-4">
            <div class="auth-logo-circle">
              <mat-icon>lock_reset</mat-icon>
            </div>
            <h3 class="mt-3 mb-1">Forgot Password?</h3>
            <p class="text-muted">
              Enter your email and we'll send you a link to reset your password.
            </p>
          </div>

          <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="w-100 mb-4">
              <mat-label>Email Address</mat-label>
              <input matInput formControlName="email" placeholder="you@example.com" />
              <mat-icon matPrefix>email</mat-icon>
              @if (forgotPasswordForm.get('email')?.hasError('required')) {
                <mat-error>Email is required</mat-error>
              }
              @if (forgotPasswordForm.get('email')?.hasError('email')) {
                <mat-error>Enter a valid email</mat-error>
              }
            </mat-form-field>

            <button mat-flat-button class="w-100 forgot-btn" type="submit" [disabled]="isLoading || forgotPasswordForm.invalid">
                @if (!isLoading) {
                    <span>Send Reset Link</span>
                }
              @if (isLoading) {
                <mat-spinner *ngIf="isLoading" diameter="24"></mat-spinner>
              }
            </button>
          </form>

          <p class="text-center mt-4 mb-0">
            <a routerLink="/" class="link">
              ← Back to Sign In
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
