<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h4 class="mb-0">Sales Quotations</h4>
        <button mat-flat-button color="primary" (click)="openAdd()">
            <mat-icon>add</mat-icon> Add Quotation
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table mat-table [dataSource]="quotations" class="w-100">
                    <ng-container matColumnDef="sqNumber">
                        <th mat-header-cell *matHeaderCellDef>SQ No</th>
                        <td mat-cell *matCellDef="let row">{{ row.sqNumber }}</td>
                    </ng-container>
                    <ng-container matColumnDef="customer">
                        <th mat-header-cell *matHeaderCellDef>Customer</th>
                        <td mat-cell *matCellDef="let row">{{ row.customer?.name || '-' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef>Date</th>
                        <td mat-cell *matCellDef="let row">{{ row.date | date:'mediumDate' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="totalAmount">
                        <th mat-header-cell *matHeaderCellDef>Total</th>
                        <td mat-cell *matCellDef="let row">{{ row.totalAmount | number:'1.2-2' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef>Status</th>
                        <td mat-cell *matCellDef="let row">
                            <span class="badge bg-info">{{ row.status }}</span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef class="text-end">Actions</th>
                        <td mat-cell *matCellDef="let row" class="text-end">
                            <button mat-icon-button color="primary" matTooltip="View" (click)="openView(row)">
                                <mat-icon>visibility</mat-icon>
                            </button>
                            <button mat-icon-button color="accent" matTooltip="Convert to SO"
                                *ngIf="row.status === 'CREATED'" (click)="convert(row)">
                                <mat-icon>transform</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" matTooltip="Cancel" *ngIf="row.status === 'CREATED'"
                                (click)="cancel(row)">
                                <mat-icon>cancel</mat-icon>
                            </button>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
            </div>
            @if (isLoading) {
            <div class="text-center py-5 text-muted">
                Loading sales quotations ...
            </div>
            }
            <div *ngIf="!isLoading && quotations.length === 0" class="text-center py-5 text-muted">
                No quotations found
            </div>
        </div>
    </div>
</div>
