<header class="navbar">
    <div class="navbar-left">
        <button mat-icon-button (click)="onToggle()" class="menu-btn">
            <mat-icon>menu</mat-icon>
        </button>
        <h5 class="page-title mb-0">Distribution & Logistics</h5>
    </div>

    <div class="navbar-right">
        <button mat-button class="user-menu-trigger" [matMenuTriggerFor]="userMenu" aria-label="Open account menu">
            <span class="user-menu-content">
                <span class="user-avatar" aria-hidden="true">{{ userInitials }}</span>
                <mat-icon class="user-chevron" aria-hidden="true">keyboard_arrow_down</mat-icon>
            </span>
        </button>

        <mat-menu #userMenu="matMenu">
            <div class="user-details" role="group" aria-label="Signed-in user">
                <span class="user-email">{{ userEmail }}</span>
                <span class="user-role">{{ 'Role: ' + userRole }}</span>
            </div>
            <mat-divider></mat-divider>
            <button mat-menu-item routerLink="/profile">
                <mat-icon>person</mat-icon>
                <span>Profile</span>
            </button>
            <button mat-menu-item (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Logout</span>
            </button>
        </mat-menu>
    </div>
</header>
