<h2 mat-dialog-title class="text-center">{{ isEdit ? 'Edit Warehouse' : 'Add Warehouse' }}</h2>
<mat-divider></mat-divider>
<mat-dialog-content class="pt-3">
    <form [formGroup]="form">

        <div class="row g-3">
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Name *</mat-label>
                    <input matInput formControlName="name" />
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Contact Person</mat-label>
                    <input matInput formControlName="contactPerson" />
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Phone</mat-label>
                    <input matInput formControlName="phone" />
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" />
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Payment Terms</mat-label>
                    <mat-select formControlName="paymentTerms">
                        <mat-option value="DUE_ON_RECEIPT">Due on Receipt</mat-option>
                        <mat-option value="NET_15">Net 15</mat-option>
                        <mat-option value="NET_30">Net 30</mat-option>
                        <mat-option value="NET_60">Net 60</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Status</mat-label>
                    <mat-select formControlName="status">
                        <mat-option value="ACTIVE">ACTIVE</mat-option>
                        <mat-option value="INACTIVE">INACTIVE</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Street</mat-label>
                    <input matInput formControlName="street" />
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>City</mat-label>
                    <input matInput formControlName="city" />
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Postal</mat-label>
                    <input matInput formControlName="postal" />
                </mat-form-field>
            </div>
        </div>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="isLoading">
        {{ isLoading ? 'Saving...' : (isEdit ? 'Update' : 'Save') }}
    </button>
</mat-dialog-actions>
